[project]
name = "project-registry"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Mirror the run-from-root convention: put the repo root on sys.path so tests
# can import the `app` package absolutely (e.g. `from app.scanner...`).
pythonpath = ["."]
testpaths = ["tests"]
